[project]
name = "forge-app"
version = "1.0.0"

# Some of these dependencies were added to address vulnerabilities
# reported by `uv audit`.
dependencies = [
  "agent-framework-core>=1.25.0",
  "agent-framework-foundry>=1.16.1",
  "agent-framework-openai>=1.18.1",
  "agent-framework-orchestrations>=1.4.2",
  "aiohttp>=3.14.5",
  "azure-ai-documentintelligence==1.0.2",
  "azure-ai-projects<2.10.0",
  "azure-cosmos>=4.16.2",
  "azure-core==1.41.0",
  "azure-identity>=1.26.0",
  "azure-mgmt-cognitiveservices>=14.1.0",
  "azure-search-documents==12.0.0",
  "azure-storage-blob>=12.31.1",
  "certifi>=2026.10.23",
  "httpx>=0.28.1",
  "Jinja2>=3.1.4",
  "markdown-pdf>=1.13.2",
  "markdown>=3.11.3",
  "multidict>=7.1.0",
  "mypy>=2.4.0",
  "oauthlib>=4.0.1",
  "openai>=3.49.0",
  "opentelemetry-api>=1.45.1",
  "pydantic-core>=2.50.4",
  "pyjwt>=2.15.1",
  "python-dotenv>=1.2.4",
  "urllib3>=2.8.0",
]
requires-python=">=3.14"
description = "Forge Accelerator primary client application"

readme = "readme.md"
keywords = ["python", "pyproject.toml", "forge", "application"]
classifiers = [
  "Programming Language :: Python"
]

[dependency-groups]
dev = [
  "Faker>=40.52.0",
  "pylint>=4.0.9",
  "pytest-asyncio>=1.4.0",
  "pytest-cov>=7.1.0",
  "pytest-randomly>=4.1.0",
  "pytest>=9.1.1",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
ignore = ["E722"]

[tool.pylint]
max-line-length = 120          # Set maximum line length
output-format = "colorized"    # Set output format

[tool.pylint.messages_control]
# Disable everything, then re-enable all errors (E*) plus selected warnings.
# W0404: reimported (module imported more than once)
# W0611: unused-import
disable = ["all"]
enable = ["E", "reimported", "unused-import"]

[tool.pylint.typecheck]
# This entry handles OS-specific functions that are not available on all platforms.
# Even the python standard library has some OS-specific differences.
generated-members = ["os.startfile", "os.killpg", "os.getpgid", "os.setsid"]
