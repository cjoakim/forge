            html,
            body {
                height: 100%;
                margin: 0;
                padding: 0;
            }

        <script type="module">
            const stadiums = [

                {"team_name": "Aston Villa", "city": "Birmingham", "stadium_name": "Villa Park", "lat": 52.5092, "lng": -1.8848},
                {"team_name": "AFC Bournemouth", "city": "Bournemouth", "stadium_name": "Vitality Stadium", "lat": 50.7352, "lng": -1.8384}, 
                {"team_name": "Brentford", "city": "London", "stadium_name": "Gtech Community Stadium", "lat": 51.4907, "lng": -0.2886}, 
                {"team_name": "Brighton & Hove Albion", "city": "Brighton", "stadium_name": "American Express Stadium", "lat": 50.8619, "lng": -0.0837}, 
                {"team_name": "Chelsea", "city": "London", "stadium_name": "Stamford Bridge", "lat": 51.4817, "lng": -0.191}, 
                {"team_name": "Coventry City", "city": "Coventry", "stadium_name": "Coventry Building Society Arena", "lat": 52.4482, "lng": -1.4956}, 
                {"team_name": "Crystal Palace", "city": "London", "stadium_name": "Selhurst Park", "lat": 51.3983, "lng": -0.0855}, 
                {"team_name": "Everton", "city": "Liverpool", "stadium_name": "Hill Dickinson Stadium", "lat": 53.4443, "lng": -2.9958}, 
                {"team_name": "Fulham", "city": "London", "stadium_name": "Craven Cottage", "lat": 51.4749, "lng": -0.2217}, 
                {"team_name": "Hull City", "city": "Hull", "stadium_name": "MKM Stadium", "lat": 53.7461, "lng": -0.3663}, 
                {"team_name": "Ipswich Town", "city": "Ipswich", "stadium_name": "Portman Road", "lat": 52.0552, "lng": 1.1451}, 
                {"team_name": "Leeds United", "city": "Leeds", "stadium_name": "Elland Road", "lat": 53.7778, "lng": -1.5722}, 
                {"team_name": "Liverpool", "city": "Liverpool", "stadium_name": "Anfield", "lat": 53.4308, "lng": -2.9608}, 
                {"team_name": "Manchester City", "city": "Manchester", "stadium_name": "Etihad Stadium", "lat": 53.4831, "lng": -2.2004}, 
                {"team_name": "Manchester United", "city": "Manchester", "stadium_name": "Old Trafford", "lat": 53.4631, "lng": -2.2913}, 
                {"team_name": "Newcastle United", "city": "Newcastle upon Tyne", "stadium_name": "St James' Park", "lat": 54.9756, "lng": -1.6217}, 
                {"team_name": "Nottingham Forest", "city": "Nottingham", "stadium_name": "City Ground", "lat": 52.94, "lng": -1.1328},

                {"team_name": "Tottenham Hotspur", "city": "London", "stadium_name": "Tottenham Hotspur Stadium", "lat": 51.6043, "lng": -0.0664}
            ];

            async function init() {
                // Request the needed libraries.
                const [{ AdvancedMarkerElement }, { InfoWindow }] = await Promise.all([
                    google.maps.importLibrary('marker'),
                    google.maps.importLibrary('maps'),
                ]);
                // Get the gmp-map element.
                const mapElement = document.querySelector('gmp-map');

                // Get the inner map.
                const innerMap = mapElement.innerMap;

                // Set map options.
                innerMap.setOptions({
                    mapTypeControl: true,
                });

                const infoWindow = new InfoWindow();

                stadiums.forEach((stadium) => {
                    const marker = new AdvancedMarkerElement({
                        map: innerMap,
                        position: { lat: stadium.lat, lng: stadium.lng },
                        title: stadium.team_name,
                    });

                    marker.addListener('click', () => {
                        infoWindow.setContent(
                            `<div>
                                <strong>${stadium.team_name}</strong><br>
                                ${stadium.city}<br>
                                ${stadium.stadium_name}
                            </div>`
                        );
                        infoWindow.open({ anchor: marker, map: innerMap });
                    });
                });
            }
            void init();

        </script>

            (g=>{var h,a,k,p="The Google Maps JavaScript API",c="google",l="importLibrary",q="__ib__",m=document,b=window;b=b[c]||(b[c]={});var d=b.maps||(b.maps={}),r=new Set,e=new URLSearchParams,u=()=>h||(h=new Promise(async(f,n)=>{await (a=m.createElement("script"));e.set("libraries",[...r]+"");for(k in g)e.set(k.replace(/[A-Z]/g,t=>"_"+t[0].toLowerCase()),g[k]);e.set("callback",c+".maps."+q);a.src=`https://maps.${c}apis.com/maps/api/js?`+e;d[q]=f;a.onerror=()=>h=n(Error(p+" could not load."));a.nonce=m.querySelector("script[nonce]")?.nonce||"";m.head.append(a)}));d[l]?console.warn(p+" only loads once. Ignoring:",g):d[l]=(f,...n)=>r.add(f)&&u().then(()=>d[l](f,...n))})({
                key: "... your Google Maps API key ..."
            });
        </script>
    </head>
    <body>
        <gmp-map center="52.589485, -1.08243" zoom="7" map-id="epl_map">
            <div id="controls" slot="control-inline-start-block-start">
                <h3>English Premier League Map</h3>
            </div>
        </gmp-map>
    </body>
</html>
